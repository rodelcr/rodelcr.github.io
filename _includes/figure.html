{%- assign img_path = include.path | remove: ".jpg" | remove: ".jpeg" | remove: ".png" | remove: ".tiff" -%}

<figure>

  <picture>
    {% if site.imagemagick.enabled %}
    {%- assign ws = site.imagemagick.widths -%}
    {%- assign w_max = ws | last -%}
    {%- comment -%}
      Each breakpoint offers a density ladder rather than a single file. The
      media queries are in CSS pixels, so a 390pt phone at 3x DPR matches the
      480px breakpoint but paints into ~1170 device pixels -- serving it the
      480px file left it visibly under-resolved. The 2x/3x candidates let the
      browser pick a file that actually matches its pixel density.
    {%- endcomment -%}
    {% for i in ws -%}
      {%- assign i2 = forloop.index0 | plus: 1 -%}
      {%- assign i3 = forloop.index0 | plus: 2 -%}
      {%- assign w2 = ws[i2] | default: w_max -%}
      {%- assign w3 = ws[i3] | default: w_max -%}
      <source
        class="responsive-img-srcset"
        media="(max-width: {{ i }}px)"
        srcset="{{ img_path | relative_url }}-{{ i }}.webp 1x, {{ img_path | relative_url }}-{{ w2 }}.webp 2x, {{ img_path | relative_url }}-{{ w3 }}.webp 3x"
      />
    {% endfor -%}
    {%- comment -%}
      Catch-all with no media query. Every source above is a max-width match, so
      a viewport wider than the largest configured width matched none of them and
      fell through to the original file -- which for these photos means tens of
      megabytes. This keeps the original as a true last resort, used only when
      the browser cannot handle WebP at all.
    {%- endcomment -%}
      <source
        class="responsive-img-srcset"
        srcset="{{ img_path | relative_url }}-{{ site.imagemagick.widths | last }}.webp"
      />
    {% endif %}

    <!-- Fallback to the original file -->
    <img 
      src="{{ include.path | relative_url }}"
      {% if include.class %}class="{{ include.class }}"{% endif %}  
      {% if include.width %}width="{{ include.width }}"{% else %}width="auto"{% endif %} 
      {% if include.height %}height="{{ include.height }}"{% else %}height="auto"{% endif %} 
      {% if include.min-width %}min-width="{{ include.min-width }}"{% endif %} 
      {% if include.min-height %}min-height="{{ include.min-height }}"{% endif %} 
      {% if include.max-width %}max-width="{{ include.max-width }}"{% endif %} 
      {% if include.max-height %}height="{{ include.max-height }}"{% endif %} 
      {% if include.alt %}alt="{{ include.alt }}"{% endif %} 
      {% if include.title %}title="{{ include.title }}"{% endif %} 
      {% if include.zoomable %}data-zoomable{% endif %}
      {%- comment -%}
        Gallery pages carry a dozen figures, none of which are visible on load.
        Lazy is the right default; pass `loading: eager` for anything above the
        fold (the About portrait) so lazily deferring it does not push out LCP.
      {%- endcomment -%}
      loading="{{ include.loading | default: 'lazy' }}"
      decoding="async"
      onerror="this.onerror=null; $('.responsive-img-srcset').remove();"
    />

  </picture>

  {%- if include.caption -%}<figcaption class="caption">{{ include.caption }}</figcaption>{%- endif %}

</figure>
